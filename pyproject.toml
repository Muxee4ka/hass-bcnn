[project]
name = "hass-bcnn"
version = "0.2.0"
description = "Home Assistant custom integration for Center-SBK (lk.bcnn.ru)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "W",    # pycodestyle warnings
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line-too-long — handled by formatter
    "B008",  # do not perform function call in argument defaults (HA voluptuous patterns)
    "SIM108", # ternary instead of if-else — sometimes hurts readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.bcnn"]
combine-as-imports = true
force-sort-within-sections = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["custom_components/bcnn"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
